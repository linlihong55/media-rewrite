services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: creator_os
      POSTGRES_USER: creator
      POSTGRES_PASSWORD: creator_local
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - creator_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creator -d creator_os"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  creator_postgres_data:
